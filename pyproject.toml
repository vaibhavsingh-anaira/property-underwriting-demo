[project]
name = "smbv"
version = "0.1.0"
description = "Small-business risk verification from real public records, websites and LLM extraction (NYC restaurants)"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1", "pandas>=2.2", "pyarrow>=16", "requests>=2.32", "rapidfuzz>=3.9", "pyyaml>=6",
  "google-genai>=1.20", "google-auth>=2.30", "boto3>=1.34", "playwright>=1.45",
  "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
smbv = "smbv.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/smbv"]
